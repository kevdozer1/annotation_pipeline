[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgeengine"
version = "0.1.0"
description = "Mode A proof-of-concept data engine and label-value benchmark for BridgeData V2."
readme = "README.md"
requires-python = ">=3.10,<3.15"
authors = [{ name = "Kevin Hopkins" }]
dependencies = [
  "duckdb>=1.1",
  "matplotlib>=3.8",
  "nbformat>=5.10",
  "numpy>=1.26",
  "pandas>=2.2",
  "pillow>=10.0",
  "pyarrow>=15.0",
  "requests>=2.31",
  "streamlit>=1.36",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bridgeengine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
